<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Interno | TABIRÁ ICES</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #fbbf24 0%, #fef3c7 100%);
  }

  .login-container {
    background: white;
    padding: 2rem;
    border-radius: 0.75rem;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
  }

  .login-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .login-header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  .login-header p {
    color: #6b7280;
    font-size: 0.875rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    font-weight: 500;
    margin-bottom: 0.5rem;
    color: #1f2937;
    font-size: 0.875rem;
  }

  .form-group input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.375rem;
    font-size: 1rem;
    transition: all 0.15s ease-out;
  }

  .form-group input:focus {
    outline: none;
    border-color: #fbbf24;
    box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
  }

  .btn-login {
    width: 100%;
    padding: 0.75rem;
    background-color: #ca8a04;
    color: white;
    border: none;
    border-radius: 0.375rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease-out;
    font-size: 1rem;
  }

  .btn-login:hover {
    background-color: #b8860b;
    transform: translateY(-2px);
  }

  .btn-login:active {
    transform: translateY(0);
  }

  .login-footer {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.875rem;
    color: #6b7280;
  }

  .login-footer a {
    color: #ca8a04;
    text-decoration: none;
  }

  .login-footer a:hover {
    text-decoration: underline;
  }

  .error {
    display: none;
    background-color: #fee2e2;
    border: 1px solid #fca5a5;
    color: #991b1b;
    padding: 0.75rem;
    border-radius: 0.375rem;
    margin-bottom: 1rem;
    font-size: 0.875rem;
  }

  .error.show {
    display: block;
  }
</style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <h1>🐦 TABIRÁ ICES</h1>
    <p>Panel Administrativo</p>
  </div>

  <div id="errorMsg" class="error"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input
        type="text"
        id="usuario"
        name="usuario"
        placeholder="admin"
        required
        autocomplete="username"
      >
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        required
        autocomplete="current-password"
      >
    </div>

    <button type="submit" class="btn-login">Acceder</button>
  </form>

  <div class="login-footer">
    <a href="index.html">← Volver al inicio</a>
  </div>
</div>

<script>
// Credenciales de demostración (en producción usar backend seguro)
const CREDENTIALS = {
  usuario: 'admin',
  password: '12345678'
};

const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');

form.addEventListener('submit', (e) => {
  e.preventDefault();

  const usuario = document.getElementById('usuario').value;
  const password = document.getElementById('password').value;

  if (usuario === CREDENTIALS.usuario && password === CREDENTIALS.password) {
    // Guardar sesión en sessionStorage
    sessionStorage.setItem('tabiraices_logged', 'true');
    sessionStorage.setItem('tabiraices_user', usuario);
    sessionStorage.setItem('tabiraices_time', new Date().getTime());

    // Redirigir al panel
    window.location.href = 'app/';
  } else {
    errorMsg.textContent = 'Usuario o contraseña incorrectos';
    errorMsg.classList.add('show');
    document.getElementById('password').value = '';
  }
});

// Limpiar mensaje de error al escribir
document.getElementById('usuario').addEventListener('input', () => {
  errorMsg.classList.remove('show');
});
document.getElementById('password').addEventListener('input', () => {
  errorMsg.classList.remove('show');
});
</script>

</body>
</html>
