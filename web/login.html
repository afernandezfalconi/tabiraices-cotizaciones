<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Interno | TABIRAÍCES</title>
<!-- iOS ignora los SVG en apple-touch-icon: tiene que ser PNG y sin transparencia. -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --color-dark: #022C43;
  --color-medium: #053F5E;
  --color-light: #115173;
  --color-accent: #FFD700;
  --color-text: #1a1a1a;
  --color-text-light: #4a5568;
  --color-white: #ffffff;
  --color-border: #e5e7eb;
  --color-error: #dc2626;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

body {
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(135deg, var(--color-dark) 0%, var(--color-medium) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

.login-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 30px;
  max-width: 100%;
}

.logo-section {
  text-align: center;
}

.logo-image {
  height: 80px;
  width: auto;
  margin-bottom: 15px;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
}

.logo-title {
  font-size: 28px;
  font-weight: 900;
  color: var(--color-white);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.logo-subtitle {
  font-size: 12px;
  color: var(--color-accent);
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.login-container {
  background: var(--color-white);
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  width: 100%;
  max-width: 400px;
  padding: 40px 32px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.login-header {
  text-align: center;
  margin-bottom: 32px;
}

.login-header h1 {
  font-size: 24px;
  font-weight: 800;
  color: var(--color-dark);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.login-header p {
  color: var(--color-text-light);
  font-size: 13px;
  font-weight: 500;
}

.error {
  display: none;
  background-color: #fee2e2;
  border: 1px solid #fca5a5;
  color: var(--color-error);
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 13px;
  font-weight: 600;
}

.error.show {
  display: block;
  animation: slideDown 0.3s ease;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--color-text);
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.form-group input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--color-border);
  border-radius: 8px;
  font-family: 'Montserrat', sans-serif;
  /* 16px y no menos: iOS Safari hace zoom al enfocar un campo mas pequeno,
     y el usuario acaba pellizcando la pantalla para volver a ver el boton. */
  font-size: 16px;
  color: var(--color-text);
  background: var(--color-white);
  transition: all 0.2s ease;
}

.form-group input::placeholder {
  color: #9ca3af;
}

.form-group input:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.1);
  background: #fafaf9;
}

.btn-login {
  width: 100%;
  padding: 12px 16px;
  background-color: var(--color-accent);
  color: var(--color-dark);
  border: none;
  border-radius: 8px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 14px;
  min-height: 46px;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 10px;
}

.btn-login:hover {
  background-color: #f0c802;
  transform: translateY(-2px);
  box-shadow: 0 8px 16px rgba(255, 215, 0, 0.3);
}

.btn-login:active {
  transform: translateY(0);
}

.btn-login:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.login-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 12px;
  color: var(--color-text-light);
}

.login-footer a {
  color: var(--color-accent);
  text-decoration: none;
  font-weight: 600;
  transition: color 0.2s ease;
}

.login-footer a:hover {
  color: #f0c802;
  text-decoration: underline;
}

@media (max-width: 480px) {
  .login-container {
    padding: 32px 24px;
  }

  .logo-image {
    height: 60px;
  }

  .logo-title {
    font-size: 22px;
  }

  .login-header h1 {
    font-size: 20px;
  }
}
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="logo-section">
    <img src="assets/img/logo-main.svg" alt="TABIRAÍCES" class="logo-image">
    <div class="logo-title">TABIRAÍCES</div>
    <div class="logo-subtitle">Sistema de Cotizaciones</div>
  </div>

  <div class="login-container">
    <div class="login-header">
      <h1>Acceso Administrativo</h1>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    <div id="errorMsg" class="error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          placeholder="admin"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn-login">Acceder</button>
    </form>

    <div class="login-footer">
      <!-- El manual va aqui a proposito: un vendedor nuevo necesita leer como
           entrar ANTES de poder entrar. -->
      <a href="manual.html">Manual de uso</a>
      <span style="opacity:.4;margin:0 8px">·</span>
      <a href="index.html">Volver al inicio</a>
    </div>
  </div>
</div>

<script>
/**
 * Aquí NO hay credenciales.
 *
 * Este archivo tenía usuario y contraseña en duro, legibles con Ctrl+U por
 * cualquiera que abriera la página. Ahora la verificación ocurre en el Worker
 * y lo único que se guarda es el token de sesión que devuelve.
 */
const API = "https://tabiraices-inventory-api.lindero-coti.workers.dev";

const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const btn = form.querySelector('button[type="submit"]');

const mostrarError = (texto) => {
  errorMsg.textContent = texto;
  errorMsg.classList.add('show');
  document.getElementById('password').value = '';
  document.getElementById('password').focus();
};

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const usuario = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  if (!usuario || !password) return;

  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    const r = await fetch(`${API}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, password }),
    });
    const json = await r.json();

    if (!r.ok || !json.success) {
      mostrarError(json.error || 'Usuario o contraseña incorrectos');
      return;
    }

    sessionStorage.setItem('tabiraices_token', json.data.token);
    sessionStorage.setItem('tabiraices_user', json.data.usuario);
    sessionStorage.setItem('tabiraices_nombre', json.data.nombre);
    sessionStorage.setItem('tabiraices_rol', json.data.rol);
    sessionStorage.setItem('tabiraices_permisos', JSON.stringify(json.data.permisos));

    window.location.href = 'app/';
  } catch (err) {
    mostrarError('No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.');
  } finally {
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
});

document.getElementById('usuario').addEventListener('input', () => {
  errorMsg.classList.remove('show');
});
document.getElementById('password').addEventListener('input', () => {
  errorMsg.classList.remove('show');
});
</script>

</body>
</html>
